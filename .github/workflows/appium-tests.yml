name: Appium Mobile Test Suite

on:
  push:
    branches: [ raj_mobileDemo ]
  pull_request:
    branches: [ raj_mobileDemo ]
  workflow_dispatch:          # allows manual trigger from GitHub Actions tab
  schedule:
    - cron: '30 3 * * *'      # daily at 9:00 AM IST (3:30 AM UTC)

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Appium tests on BrowserStack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: npx wdio run ./config/browserstack.config.js --cucumberOpts.tags="@sauceLabsApp"

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline --save-dev
          npx allure generate allure-results --clean -o allure-report

      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: reports/html
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      - name: Publish Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/raj_mobileDemo'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.TOKEN_GITHUB }}
          publish_dir: ./allure-report
          destination_dir: allure-report
